# Netlify: provisional, private SmartHub website (only the public pages, no database).
# To open the full app later, remove SHOWCASE_MODE and add DATABASE_URL, AUTH_SECRET and AUTH_URL.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Public pages only: accounts and SmartDesk redirect to /contacto.
  SHOWCASE_MODE = "1"
  # Search engines stay out until this is set to "on" (and the site is redeployed).
  # SITE_INDEXING = "on"
